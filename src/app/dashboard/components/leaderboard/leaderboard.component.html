<mat-card>
  <mat-card-header>
    <mat-card-title>Leaderboard</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-tab-group>
      <mat-tab label="Global">
        <div *ngIf="globalLeaderboard.length === 0" class="empty-leaderboard">
          <p>No ranked users yet — be the first!</p>
        </div>
        <mat-list *ngIf="globalLeaderboard.length > 0">
          <mat-list-item *ngFor="let entry of globalLeaderboard; let i = index">
            <span mat-line>
              <strong>{{ i + 1 }}. {{ entry.displayName }}</strong>
            </span>
            <span mat-line>Points: {{ entry.points }}</span>
          </mat-list-item>
        </mat-list>
      </mat-tab>
      <mat-tab label="Country">
        <div *ngIf="countryLeaderboard.length === 0" class="empty-leaderboard">
          <p>No ranked users from your country yet.</p>
        </div>
        <mat-list *ngIf="countryLeaderboard.length > 0">
          <mat-list-item *ngFor="let entry of countryLeaderboard; let i = index">
            <span mat-line>
              <strong>{{ i + 1 }}. {{ entry.displayName }}</strong>
            </span>
            <span mat-line>Points: {{ entry.points }}</span>
          </mat-list-item>
        </mat-list>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
